name: Feature request
description: 提议与 Pelican Sentinel 固定观察任务相关的改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的实际工作流问题。项目当前围绕固定提示词、本地历史和菜单栏观察设计；请同时说明对隐私、额度和现有 provider 行为的影响。

  - type: input
    id: summary
    attributes:
      label: 建议摘要
      description: 用一句话描述提议的变化。
      placeholder: 例如：为历史记录增加按日期筛选。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景遇到什么限制？请给出可观察的工作流。
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: 期望结果
      description: 说明完成后用户应看到或能够完成什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可填写当前 workaround、为何不足，以及不采用其他方案的原因。

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 说明是否影响 provider、模型额度、本地存储、Keychain、双语界面或历史兼容性。

  - type: textarea
    id: context
    attributes:
      label: 补充材料
      description: 可提供脱敏截图或最小示例；不要上传凭据、用户历史或原始模型响应。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认补充材料不包含 API key、登录信息、Keychain 内容、用户历史或其他秘密。
          required: true
